<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>サーバーゲーム</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="manifest" href="./manifest.json" />
  </head>
  <body>
    <div id="wrapper">
      <div id="aspect-wrapper">
        <img
          id="server-game-title"
          src="./images/server-game-title.svg"
          alt="画像が見つかりません"
        />
        <div id="title-bottom"></div>
        <div id="game-list-icons">
          <a
            class="list-item"
            href="https://okome-program.github.io/server-game-sample/marubatu"
          >
            <img
              class="list-item-img"
              id="marubatu-game"
              src="./images/marubatu-game.svg"
              alt="画像が見つかりません"
            />
          </a>
          <a
            class="list-item"
            href="https://okome-program.github.io/server-game-sample/janken"
          >
            <img
              class="list-item-img"
              id="janken"
              src="./images/janken.svg"
              alt="画像が見つかりません"
            />
          </a>
        </div>
      </div>
    </div>
    <script src="./scripts/layout.js"></script>
  </body>
</html>
